name: RELIC - Import Music Assets

on:
  push:
    branches: ["control/**", "audio/**", "branding/**"]
    paths:
      - "music-inbox/**/*.zip"
      - "music-inbox/*.zip"
      - ".github/workflows/import-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    name: Extract and validate game music
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Find and extract supported audio tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/music
          shopt -s nullglob
          archives=(music-inbox/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No music ZIP found. Add a ZIP containing audio tracks under music-inbox/ and push to a control/** or audio/** branch."
            exit 1
          fi
          found=0
          for archive in "${archives[@]}"; do
            echo "Inspecting $archive"
            while IFS= read -r entry; do
              case "${entry,,}" in
                *.mp3|*.ogg|*.wav|*.m4a|*.aac|*.flac)
                  base="$(basename "$entry")"
                  [[ "$base" != "." && "$base" != ".." ]] || continue
                  unzip -p "$archive" "$entry" > "app/src/main/assets/music/$base"
                  test -s "app/src/main/assets/music/$base"
                  echo "Imported: $base ($(stat -c%s "app/src/main/assets/music/$base") bytes)"
                  found=$((found + 1))
                  ;;
              esac
            done < <(unzip -Z1 "$archive")
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No supported audio files found. Supported: MP3, OGG, WAV, M4A, AAC, FLAC."
            exit 1
          fi
          printf 'Imported audio files: %s\n' "$found"
          find app/src/main/assets/music -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit imported music assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/music
          if git diff --cached --quiet; then
            echo "No new music changes to commit."
            exit 0
          fi
          git commit -m "audio: import validated RELIC music assets"
          git push
