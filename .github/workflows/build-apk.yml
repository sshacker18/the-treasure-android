name: THE TREASURE - Android Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - qa/playwright-allure-ci
      - fix/launcher-icon-and-android-smoke
      - fix/music-background-resume

permissions:
  contents: read

concurrency:
  group: treasure-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-smoke-test:
    name: Build, sign, install and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release inputs and app icon
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable/ic_launcher.xml
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
          if [ -z "${SIGNING_CONFIG:-}" ]; then
            echo "::error::Missing repository secret TREASURE_QA_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$SIGNING_CONFIG" | jq -e '
            (.keystore_base64 | strings | length > 0) and
            (.keystore_password | strings | length > 0) and
            (.key_alias | strings | length > 0)
          ' >/dev/null

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Sign and verify APK
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/treasure-signing" release-apk
          printf '%s' "$SIGNING_CONFIG" | jq -j '.keystore_base64' | base64 --decode > "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          test -s "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/the-treasure-aligned.apk"
          KEYSTORE_PASSWORD="$(printf '%s' "$SIGNING_CONFIG" | jq -j '.keystore_password')"
          KEY_ALIAS="$(printf '%s' "$SIGNING_CONFIG" | jq -j '.key_alias')"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/treasure-signing/treasure-qa.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out release-apk/THE-TREASURE.apk \
            "$RUNNER_TEMP/the-treasure-aligned.apk"
          unset KEYSTORE_PASSWORD KEY_ALIAS SIGNING_CONFIG
          "$BUILD_TOOLS/apksigner" verify --verbose release-apk/THE-TREASURE.apk
          "$BUILD_TOOLS/aapt" dump badging release-apk/THE-TREASURE.apk | tee release-apk/apk-metadata.txt
          grep -q "package: name='com.thetreasure.game'" release-apk/apk-metadata.txt
          grep -q "application-icon" release-apk/apk-metadata.txt
          sha256sum release-apk/THE-TREASURE.apk | tee release-apk/SHA256SUMS.txt

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb install -r release-apk/THE-TREASURE.apk
            adb shell am force-stop com.thetreasure.game
            adb shell am start -W -n com.thetreasure.game/.MainActivity
            sleep 5
            adb shell pidof com.thetreasure.game
            # Tap the centered START THE ADVENTURE control after the intro is rendered.
            read -r SCREEN_W SCREEN_H <<< "$(adb shell wm size | sed -n 's/.*: \([0-9]*\)x\([0-9]*\).*/\1 \2/p')"
            adb shell input tap "$((SCREEN_W / 2))" "$((SCREEN_H * 58 / 100))"
            sleep 4
            adb shell pidof com.thetreasure.game
            adb shell screencap -p /sdcard/treasure-launch.png
            adb pull /sdcard/treasure-launch.png release-apk/treasure-launch.png
            adb shell dumpsys activity activities | grep -E 'mResumedActivity.*com\.thetreasure\.game|ResumedActivity.*com\.thetreasure\.game'
            adb logcat -d -s AndroidRuntime:E chromium:E WebViewFactory:E > release-apk/launch-log.txt
            if grep -E 'FATAL EXCEPTION|Uncaught TypeError|Uncaught SyntaxError' release-apk/launch-log.txt; then
              echo "::error::Fatal app or WebView JavaScript error detected during launch."
              exit 1
            fi

      - name: Upload verified APK and launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-verified-APK
          path: release-apk/
          if-no-files-found: error
          retention-days: 14
