name: RELIC - Build, Test, and APK Artifacts

on:
  workflow_call:
  push:
    branches: ["qa/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and validate Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle selected offline soundtrack tracks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, zipfile

          archive = Path("the_treasure_music_bundle.zip")
          html_path = Path("app/src/main/assets/index.html")
          if not archive.exists():
              print("Music bundle not present; procedural soundtrack fallback remains enabled.")
              raise SystemExit(0)

          extensions = {".mp3", ".ogg", ".wav", ".m4a", ".aac", ".flac"}
          with zipfile.ZipFile(archive) as zf:
              files = [n for n in zf.namelist() if Path(n).suffix.lower() in extensions and not n.endswith("/")]
              files = sorted(files, key=lambda n: (Path(n).name.lower(), n.lower()))
              if not files:
                  print("No supported audio files found; procedural soundtrack fallback remains enabled.")
                  raise SystemExit(0)

              groups = [
                  ("forest", ("forest", "ambient", "ambience", "explor", "nature", "calm", "adventure")),
                  ("ruins", ("ruin", "temple", "dungeon", "ancient", "mystery", "dark")),
                  ("finale", ("battle", "boss", "combat", "epic", "finale", "victory", "action")),
              ]
              chosen = []
              used = set()
              for label, keywords in groups:
                  matches = [n for n in files if n not in used and any(k in Path(n).name.lower() for k in keywords)]
                  candidate = matches[0] if matches else next((n for n in files if n not in used), None)
                  if candidate:
                      used.add(candidate)
                      chosen.append((label, candidate))

              out_dir = Path("app/src/main/assets/audio")
              out_dir.mkdir(parents=True, exist_ok=True)
              tracks = []
              for label, source in chosen:
                  suffix = Path(source).suffix.lower()
                  destination = out_dir / f"{label}{suffix}"
                  with zf.open(source) as src, destination.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
                  tracks.append(destination.relative_to(Path("app/src/main/assets")).as_posix())
                  print(f"Bundled soundtrack: {source} -> {destination}")

          html = html_path.read_text()
          marker = "window.TREASURE_AUDIO_TRACKS = window.TREASURE_AUDIO_TRACKS || [];"
          replacement = "window.TREASURE_AUDIO_TRACKS = " + json.dumps(tracks) + ";"
          if html.count(marker) != 1:
              raise SystemExit(f"Expected one soundtrack injection marker, found {html.count(marker)}")
          html_path.write_text(html.replace(marker, replacement))
          print("Offline soundtrack playlist:", json.dumps(tracks))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate project, version, and embedded chapter assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          gradle = Path("app/build.gradle.kts").read_text()

          assert "chapter-complete" in html, "Missing chapter completion bridge"
          chapters = re.findall(r"data-chapter=[\"']?([0-3])", html)
          assert len(set(chapters)) == 4, f"Expected chapter menu entries 1-4, found {sorted(set(chapters))}"
          assert re.search(r"<\\/script", html, re.IGNORECASE), "Embedded chapter script closing tags must remain escaped in wrapper source"
          assert 'applicationId = "com.thetreasure.game"' in gradle, "Unexpected Android application ID"
          assert re.search(r'versionCode\s*=\s*[1-9]\d*', gradle), "versionCode must be a positive integer"
          version = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          assert version, "Missing versionName"
          target = re.search(r"targetSdk\s*=\s*(\d+)", gradle)
          assert target and int(target.group(1)) >= 36, "Android target SDK must be 36+"
          assert re.search(r'android:label="The Treasure"', manifest), "Manifest must use the user-facing app name The Treasure"
          print(f"Static checks passed: THE TREASURE {version.group(1)}, four chapters, target SDK {target.group(1)}.")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run available unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Build unsigned Android App Bundle
        run: gradle bundleRelease --no-daemon

      - name: Build signed release APK when upload-key secrets are configured
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_UPLOAD_KEYSTORE_BASE64:-}" || -z "${PLAY_UPLOAD_STORE_PASSWORD:-}" || -z "${PLAY_UPLOAD_KEY_ALIAS:-}" || -z "${PLAY_UPLOAD_KEY_PASSWORD:-}" ]]; then
            echo "Signing secrets are not fully configured; skipping signed APK. Unsigned release artifact remains available."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/play-upload-keystore.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          export PLAY_UPLOAD_KEYSTORE_PATH="$KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$SIGNED_APK"
          mkdir -p build-metadata
          cp "$SIGNED_APK" build-metadata/THE-TREASURE-signed.apk
          sha256sum build-metadata/THE-TREASURE-signed.apk > build-metadata/THE-TREASURE-signed-SHA256SUM.txt
          cat build-metadata/THE-TREASURE-signed-SHA256SUM.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-signed-APK
          path: |
            build-metadata/THE-TREASURE-signed.apk
            build-metadata/THE-TREASURE-signed-SHA256SUM.txt
          if-no-files-found: ignore
          retention-days: 14


      - name: Generate artifact manifest and enforce APK size budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-metadata
          APK_DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          APK_RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          for file in "$APK_DEBUG" "$APK_RELEASE" "$AAB"; do
            test -s "$file"
          done
          # Initial lightweight budget: 50 MiB per APK. Raise only with a reviewed reason.
          for file in "$APK_DEBUG" "$APK_RELEASE"; do
            bytes=$(stat -c%s "$file")
            if [ "$bytes" -gt 52428800 ]; then
              echo "::error file=$file::APK exceeds the 50 MiB size budget ($bytes bytes)"
              exit 1
            fi
          done
          {
            echo "app_name=THE TREASURE"
            grep -E 'applicationId =|versionCode =|versionName =' app/build.gradle.kts | sed 's/^/android_config=/'
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            sha256sum "$APK_DEBUG" "$APK_RELEASE" "$AAB"
            stat -c '%n %s bytes' "$APK_DEBUG" "$APK_RELEASE" "$AAB"
          } > build-metadata/build-manifest.txt
          cat build-metadata/build-manifest.txt

      - name: Upload debug APK (rapid testing lane)
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-apk-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-bundle-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30
