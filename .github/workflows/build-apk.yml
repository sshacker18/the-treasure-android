name: THE TREASURE - QA and single APK

on:
  workflow_dispatch:

concurrency:
  group: treasure-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    name: Playwright gameplay QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright gameplay and responsive tests
        run: npm run test:e2e

  android-build:
    name: Build one installable debug APK
    runs-on: ubuntu-latest
    needs: browser-qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate project and chapter assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          assert "chapter-complete" in html, "Missing chapter completion bridge"
          assert len(re.findall(r"data-chapter=[\"']?[0-3]", html)) >= 4, "Expected chapter menu entries 1-4"
          gradle = Path("app/build.gradle.kts").read_text()
          target = re.search(r"targetSdk\s*=\s*(\d+)", gradle)
          assert target and int(target.group(1)) >= 36, "Android target SDK must be 36+"
          print("Project and static checks passed.")
          PY
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
