name: RELIC - Playwright QA, Android Build, and APK Artifacts

on:
  push:
    branches: [main, "qa/**", "ci/**", "branding/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: relic-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    name: Playwright gameplay and responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json

      - name: Install Playwright dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare report directories
        run: mkdir -p test-results/artifacts

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright reports, JUnit, screenshots, videos, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-playwright-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  android-build:
    name: Build and validate RELIC Android APKs
    runs-on: ubuntu-latest
    needs: browser-qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate RELIC identity, version, and embedded chapter assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/relic/game/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          gradle = Path("app/build.gradle.kts").read_text()
          activity = Path("app/src/main/java/com/relic/game/MainActivity.java").read_text()

          assert "chapter-complete" in html, "Missing chapter completion bridge"
          chapters = [str(i) for i in range(4) if f'data-chapter="{i}"' in html]
          assert len(chapters) == 4, f"Expected four chapter menu entries, found {chapters}"
          assert r"<\\/script" in html.lower(), "Embedded chapter script closing tags must remain escaped"
          assert 'applicationId = "com.relic.game"' in gradle, "Unexpected application ID"
          assert 'namespace = "com.relic.game"' in gradle, "Unexpected namespace"
          assert "package com.relic.game;" in activity, "Activity package mismatch"
          assert "versionCode = 4" in gradle, "Expected versionCode 4"
          assert 'versionName = "2.0"' in gradle, "Expected versionName 2.0"
          assert "targetSdk = 36" in gradle, "Expected target SDK 36"
          assert 'android:label="RELIC"' in manifest, "Launcher label must be RELIC"
          print("Static checks passed: RELIC 2.0, com.relic.game, four chapters, target SDK 36.")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run available Android unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Build unsigned Android App Bundle
        run: gradle bundleRelease --no-daemon

      - name: Generate artifact manifest and enforce APK size budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-metadata
          APK_DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          APK_RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          for file in "$APK_DEBUG" "$APK_RELEASE" "$AAB"; do test -s "$file"; done
          for file in "$APK_DEBUG" "$APK_RELEASE"; do
            bytes=$(stat -c%s "$file")
            if [ "$bytes" -gt 52428800 ]; then
              echo "::error file=$file::APK exceeds the 50 MiB size budget ($bytes bytes)"
              exit 1
            fi
          done
          {
            echo "app_name=RELIC"
            grep -E 'applicationId =|namespace =|versionCode =|versionName =' app/build.gradle.kts | sed 's/^/android_config=/'
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            sha256sum "$APK_DEBUG" "$APK_RELEASE" "$AAB"
            stat -c '%n %s bytes' "$APK_DEBUG" "$APK_RELEASE" "$AAB"
          } > build-metadata/build-manifest.txt
          cat build-metadata/build-manifest.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: relic-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: relic-release-apk-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: relic-release-bundle-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            build-metadata/build-manifest.txt
          if-no-files-found: error
          retention-days: 30
