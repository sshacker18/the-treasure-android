name: Build and Validate THE TREASURE Android

on:
  push:
    branches: [main, "qa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug and Play candidates
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install browser test dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright gameplay smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate chapter shell and release config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          assert len(re.findall(r'"id": "[1-4]"', html)) == 4, "Expected all four chapter definitions"
          assert len(re.findall(r'data-chapter="[0-3]"', html)) == 4, "Expected chapter menu buttons"
          assert 'body.playing #shellHeader,body.playing #shellFooter{display:none}' in html, "Immersive chrome rule missing"
          assert "chapter-complete" in html, "Chapter completion bridge missing"
          gradle = Path("app/build.gradle.kts").read_text()
          target = re.search(r'targetSdk\s*=\s*(\d+)', gradle)
          assert target and int(target.group(1)) >= 36, "Play submission target must be API 36+"
          assert "PLAY_UPLOAD_KEYSTORE_PATH" in gradle, "Protected Play signing configuration missing"
          print("Static checks passed: Chapters 1–4, immersive menu, completion bridge, API 36, protected signing config")
          PY

      - name: Prepare protected Play upload key
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/the-treasure-upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Explain unsigned candidate mode
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 == '' || env.PLAY_UPLOAD_STORE_PASSWORD == '' || env.PLAY_UPLOAD_KEY_ALIAS == '' || env.PLAY_UPLOAD_KEY_PASSWORD == '' }}
        run: echo "Play upload-key secrets are not fully configured. The AAB will be unsigned and MUST NOT be uploaded to Play Console."

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK candidate
        run: gradle assembleRelease --no-daemon

      - name: Build Android App Bundle candidate
        run: gradle bundleRelease --no-daemon

      - name: Verify Play App Bundle signature
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != '' }}
        run: jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play bundle
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-bundle-signed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Play bundle candidate
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 == '' || env.PLAY_UPLOAD_STORE_PASSWORD == '' || env.PLAY_UPLOAD_KEY_ALIAS == '' || env.PLAY_UPLOAD_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-bundle-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK candidate
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_BASE64 == '' || env.PLAY_UPLOAD_STORE_PASSWORD == '' || env.PLAY_UPLOAD_KEY_ALIAS == '' || env.PLAY_UPLOAD_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-treasure-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
