name: THE TREASURE - Signed APK Pipeline

on:
  workflow_call:
    secrets:
      TREASURE_QA_KEYSTORE_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: treasure-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-upload:
    name: Build, sign, and upload one APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate single signing secret
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_CONFIG:-}" ]; then
            echo "::error::Missing repository secret TREASURE_QA_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$SIGNING_CONFIG" | jq -e '
            (.keystore_base64 | strings | length > 0) and
            (.keystore_password | strings | length > 0) and
            (.key_alias | strings | length > 0)
          ' >/dev/null || {
            echo "::error::TREASURE_QA_KEYSTORE_BASE64 must contain the JSON signing configuration created for this workflow."
            exit 1
          }
      - name: Validate project and chapter assets
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
      - name: Build production release APK
        run: gradle assembleRelease --no-daemon
      - name: Sign release APK with persistent key
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/treasure-signing"
          printf '%s' "$SIGNING_CONFIG" | jq -j '.keystore_base64' | base64 --decode > "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          test -s "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/the-treasure-aligned.apk"
          KEYSTORE_PASSWORD="$(printf '%s' "$SIGNING_CONFIG" | jq -j '.keystore_password')"
          KEY_ALIAS="$(printf '%s' "$SIGNING_CONFIG" | jq -j '.key_alias')"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/treasure-signing/treasure-qa.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/THE-TREASURE.apk" \
            "$RUNNER_TEMP/the-treasure-aligned.apk"
          unset KEYSTORE_PASSWORD KEY_ALIAS SIGNING_CONFIG
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/THE-TREASURE.apk"
          sha256sum "$RUNNER_TEMP/THE-TREASURE.apk" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Upload the signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-signed-APK
          path: |
            ${{ runner.temp }}/THE-TREASURE.apk
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
