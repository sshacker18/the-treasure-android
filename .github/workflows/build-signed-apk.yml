name: THE TREASURE - Signed APK Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - qa/playwright-allure-ci
    paths:
      - ".github/workflows/build-signed-apk.yml"
      - "app/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: treasure-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-qa:
    name: Playwright gameplay QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run gameplay and responsive tests
        run: npm run test:e2e

  build-sign-upload:
    name: Build, sign, and upload one APK
    runs-on: ubuntu-latest
    needs: gameplay-qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate single signing secret
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_CONFIG:-}" ]; then
            echo "::error::Missing repository secret TREASURE_QA_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$SIGNING_CONFIG" | jq -e '
            (.keystore_base64 | strings | length > 0) and
            (.keystore_password | strings | length > 0) and
            (.key_alias | strings | length > 0) and
            (.key_password | strings | length > 0)
          ' >/dev/null || {
            echo "::error::TREASURE_QA_KEYSTORE_BASE64 must contain the JSON signing configuration created for this workflow."
            exit 1
          }
      - name: Validate project and chapter assets
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Decode persistent QA signing key
        env:
          SIGNING_CONFIG: ${{ secrets.TREASURE_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/treasure-signing"
          printf '%s' "$SIGNING_CONFIG" | jq -r '.keystore_base64' | base64 --decode > "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          test -s "$RUNNER_TEMP/treasure-signing/treasure-qa.jks"
          echo "TREASURE_KEYSTORE_PATH=$RUNNER_TEMP/treasure-signing/treasure-qa.jks" >> "$GITHUB_ENV"
          echo "QA_KEYSTORE_PASSWORD=$(printf '%s' "$SIGNING_CONFIG" | jq -r '.keystore_password' | base64 -w 0)" >> "$GITHUB_ENV"
          echo "QA_KEY_ALIAS=$(printf '%s' "$SIGNING_CONFIG" | jq -r '.key_alias' | base64 -w 0)" >> "$GITHUB_ENV"
          echo "QA_KEY_PASSWORD=$(printf '%s' "$SIGNING_CONFIG" | jq -r '.key_password' | base64 -w 0)" >> "$GITHUB_ENV"
      - name: Sign APK with persistent key
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/the-treasure-aligned.apk"
          KEYSTORE_PASSWORD="$(printf '%s' "$QA_KEYSTORE_PASSWORD" | base64 --decode)"
          KEY_ALIAS="$(printf '%s' "$QA_KEY_ALIAS" | base64 --decode)"
          KEY_PASSWORD="$(printf '%s' "$QA_KEY_PASSWORD" | base64 --decode)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$TREASURE_KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/THE-TREASURE.apk" \
            "$RUNNER_TEMP/the-treasure-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/THE-TREASURE.apk"
          sha256sum "$RUNNER_TEMP/THE-TREASURE.apk" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-signed-APK
          path: |
            ${{ runner.temp }}/THE-TREASURE.apk
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
