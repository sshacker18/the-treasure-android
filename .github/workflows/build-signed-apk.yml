name: RELIC - Play Upload-Signed APK Pipeline

on:
  workflow_call:
    secrets:
      PLAY_UPLOAD_KEYSTORE_BASE64:
        required: true
      PLAY_UPLOAD_STORE_PASSWORD:
        required: true
      PLAY_UPLOAD_KEY_ALIAS:
        required: true
      PLAY_UPLOAD_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: relic-play-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-upload:
    name: Build, sign, and upload Play-signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate Play upload-key secrets and project
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          test -f app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml

      - name: Build and verify the signed internal-testing APK
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/play-upload-keystore.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          export PLAY_UPLOAD_KEYSTORE_PATH="$KEYSTORE_PATH"

          gradle assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          OUT="$RUNNER_TEMP/relic-release"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/RELIC-internal-testing.apk"
          sha256sum "$OUT/RELIC-internal-testing.apk" > "$OUT/SHA256SUMS.txt"

          unset PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD PLAY_UPLOAD_KEYSTORE_PATH

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RELIC-internal-testing-signed-APK
          path: |
            ${{ runner.temp }}/relic-release/RELIC-internal-testing.apk
            ${{ runner.temp }}/relic-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
