name: THE TREASURE - Master Release Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - qa/playwright-allure-ci
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/**"
  push:
    branches:
      - qa/playwright-allure-ci
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: treasure-master-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Child 2 - Build, sign, and publish APK
    uses: ./.github/workflows/build-signed-apk.yml
    secrets: inherit

  # Emulator upgrade testing is intentionally disabled to keep release delivery unblocked.
  # The signed APK is still built, verified, and uploaded by signed-release.

  master-summary:
    name: Master release status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - signed-release
    steps:
      - name: Report pipeline result
        env:
          RELEASE_RESULT: ${{ needs.signed-release.result }}
          UPGRADE_RESULT: "skipped"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## THE TREASURE — Master Release Pipeline"
            echo
            echo "- Signed APK release: **${RELEASE_RESULT}**"
            echo "- APK install/upgrade test: **disabled by request**"
            echo
            if [ "${RELEASE_RESULT}" = "success" ]; then
              echo "### Result: SUCCESS"
              echo "Download the `THE-TREASURE-signed-APK` artifact from this master run."
            else
              echo "### Result: NEEDS ATTENTION"
              echo "Open the failed child job above for the first failing step."
            fi
            echo
            echo "[Open this master run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RELEASE_RESULT}" != "success" ] || [ "${UPGRADE_RESULT}" != "success" ]; then
            exit 1
          fi
