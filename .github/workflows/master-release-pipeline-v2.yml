name: THE TREASURE - Master Release Pipeline V2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "MASTER_PIPELINE_V2.md"
  push:
    branches: ["ci/**", "fix/**", "feat/**"]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "MASTER_PIPELINE_V2.md"

permissions:
  contents: read

concurrency:
  group: treasure-master-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight and edge-case checks (no Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app structure and critical game contract
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("app/build.gradle.kts").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          html = Path("app/src/main/assets/index.html").read_text()
          code = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          assert code and int(code.group(1)) > 0, "versionCode must be a positive integer"
          assert name and name.group(1).strip(), "versionName must be present"
          assert 'applicationId = "com.thetreasure.game"' in gradle, "Unexpected applicationId"
          assert 'android:name=".MainActivity"' in manifest, "Launcher activity missing"
          assert 'android.intent.action.MAIN' in manifest, "Launcher MAIN intent missing"
          assert 'android.intent.category.LAUNCHER' in manifest, "Launcher category missing"
          assert "chapter-complete" in html, "Missing chapter completion bridge"
          chapters = set(re.findall(r'data-chapter="([0-3])"', html))
          assert len(chapters) == 4, f"Expected four chapter entries; found {sorted(chapters)}"
          assert "START ADVENTURE" in html, "Start action label missing"
          assert "\\n// Make overlays predictable" not in html, "Literal escaped newlines in shell JavaScript can break script parsing"
          assert "gameFrame" in html, "Game frame integration missing"
          print(f"Preflight passed: versionCode={code.group(1)}, versionName={name.group(1)}, four chapter entries.")
          PY

  signed-release:
    name: Build and sign one APK
    needs: preflight
    uses: ./.github/workflows/build-signed-apk.yml
    secrets: inherit

  install-launch-smoke:
    name: Install and launch signed APK on emulator
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source for package metadata
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"
          accept-android-sdk-licenses: true
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: THE-TREASURE-signed-APK
          path: signed-artifact
      - name: Verify artifact and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="signed-artifact/THE-TREASURE.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee signed-artifact/verified-SHA256SUMS.txt
      - name: Boot emulator and install app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb install -r signed-artifact/THE-TREASURE.apk
            adb shell monkey -p com.thetreasure.game 1
            sleep 8
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.thetreasure.game'
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Fatal signal' | grep -q 'com.thetreasure.game'; then
              echo "::error::App crash signature detected after launch."
              exit 1
            fi
            adb shell pm path com.thetreasure.game
      - name: Upload verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: THE-TREASURE-signed-APK-verified
          path: |
            signed-artifact/THE-TREASURE.apk
            signed-artifact/SHA256SUMS.txt
            signed-artifact/verified-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  master-summary:
    name: Master release verdict
    if: always()
    needs: [preflight, signed-release, install-launch-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Report honest pipeline result
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          SIGNED: ${{ needs.signed-release.result }}
          SMOKE: ${{ needs.install-launch-smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## THE TREASURE — Master Pipeline V2"
            echo
            echo "- Commit: $COMMIT_SHA"
            echo "- Preflight / edge checks: **$PREFLIGHT**"
            echo "- Signed APK: **$SIGNED**"
            echo "- Emulator install/launch smoke: **$SMOKE**"
            echo "- [Open workflow run]($RUN_URL)"
            echo
            if [ "$PREFLIGHT" = success ] && [ "$SIGNED" = success ] && [ "$SMOKE" = success ]; then
              echo "### Result: PASS — signed APK installed and launched in emulator."
              echo "This does not imply physical-device gameplay or in-place upgrade verification."
            else
              echo "### Result: FAIL — one or more required gates did not pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PREFLIGHT" != success ] || [ "$SIGNED" != success ] || [ "$SMOKE" != success ]; then
            exit 1
          fi
