name: Tester User 1 - Smoke and E2E per page

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tap-to-move-auto-relics
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.*"
      - ".github/workflows/tester-user-1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.*"
      - ".github/workflows/tester-user-1.yml"

permissions:
  contents: read

concurrency:
  group: tester-user-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester-user-1:
    name: "Tester User 1 / Playwright smoke + E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java for Allure report
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare test evidence folders
        run: mkdir -p test-results/artifacts allure-results
      - name: List discovered tests (audit page/chapter coverage)
        run: npx playwright test --list | tee test-results/discovered-tests.txt
      - name: Run smoke and end-to-end tests
        run: npm run test:e2e
      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && find allure-results -type f -print -quit | grep -q .; then
            npx allure generate allure-results --clean -o allure-report || echo "Allure HTML generation failed; raw results will still be uploaded."
          else
            echo "No Allure result files were produced."
          fi
      - name: Upload smoke/E2E reports, screenshots, videos, traces and test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-user-1-playwright-evidence
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
